<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
      integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
      crossorigin="anonymous">

<link rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
      integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
      crossorigin="anonymous">

<title>Gestion des Dépenses</title>

<style>
  body {
    padding-top: 50px;
  }
  .special {
    padding-top:50px;
  }
  .soldepositif {
      font-weight: bold;
      color: #32cd32;
  }
  .soldenegatif {
      font-weight: bold;
      color: #e74c3c;
  }
  .soldenul {
      font-weight: bold;
      color: #808080;
  }
  .bouton-retour {
  margin-top: 50px; 
  }

</style>
</head>
<body>

  <nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container">
      <div class="navbar-header">
        <a class="navbar-brand" href="/">Syst&egraveme de gestion des comptes</a>
      </div>
    </div>
  </nav>

  <div id="output" class="container special">
    <h2 class="h2">Liste des op&eacute;rations pour <span th:text="${nom}"></h2>
	<p th:if="${solde > 0}">Solde du compte : <span class="soldepositif" th:text="${#numbers.formatDecimal(solde, 1, 'WHITESPACE', 2, 'COMMA')} + ' €'">  €</span></p>
	<p th:if="${solde == 0}">Solde du compte : <span class="soldenul" th:text="${#numbers.formatDecimal(solde, 1, 'WHITESPACE', 2, 'COMMA')} + ' €'">  €</span></p>
	<p th:if="${solde < 0}">Solde du compte : <span class="soldenegatif" th:text="${#numbers.formatDecimal(solde, 1, 'WHITESPACE', 2, 'COMMA')} + ' €'">  €</span></p>
	

    <div class="table-responsive">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Cat&eacute;gorie</th>
            <th>Montant (€)</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${lignes.empty}">
            <td colspan="5">Aucune op&eacute;ration enregistr&eacute;e</td>
          </tr>
          <tr th:each="ligne : ${lignes}">
            <td><span th:text="${#dates.format(ligne.dateOperation, 'dd/MM/yyyy')}"> Date </span></td>
            <td><span th:text="${ligne.description}"> Description </span></td>
            <td><span th:text="${ligne.categorie}"> Cat&eacute;gorie </span></td>
            <td><span th:text="${#numbers.formatDecimal(ligne.montant, 1, 'WHITESPACE', 2, 'COMMA')}"> Montant </span></td>
            <td>
              <a th:href="@{/mettreAJourLigne/{id}(id=${ligne.id})}">
                <button class="btn btn-warning">Modifier</button>
              </a>
              <form id="formSuppression" th:action="@{/supprimerLigne/{id}(id=${ligne.id})}" 
						method="post"
						style="display: inline;">
					<button type="button" class="btn btn-danger" onclick="confirmerSuppression(this.closest('form'))">Supprimer</button>
			  </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <h4><a th:href="@{/creerLigne/{id}(id=${numeroCompte})}">Ajouter une nouvelle op&eacute;ration</a></h4>
    <a th:href="@{/}">
      <button class="btn btn-primary bouton-retour">Retour</button>
    </a>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
          integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
          crossorigin="anonymous"></script>
</body>
<script>
	function confirmerSuppression(form) {
  Swal.fire({
    title: 'Êtes-vous sûr ?',
    text: "Cette action est irréversible.",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Oui, supprimer',
    cancelButtonText: 'Annuler',
    buttonsStyling: false,
    customClass: {
      confirmButton: 'btn btn-danger',
      cancelButton: 'btn btn-info'
    }
  }).then((result) => {
    if (result.isConfirmed) {
      form.submit(); 
    }
  });
 }
</script>
</html>
