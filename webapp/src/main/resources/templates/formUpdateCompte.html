<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
	integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
	crossorigin="anonymous">

<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
	integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
	crossorigin="anonymous">

<title>Employee Web Application</title>

<style>
body {
	padding-top: 50px;
}

.special {
	padding-top: 50px;
}
</style>
</head>
<body>

	<nav class="navbar navbar-inverse navbar-fixed-top">
		<div class="container">
			<div class="navbar-header">
				<a class="navbar-brand" href="/">Syst&egrave;me de gestion des
					comptes</a>
			</div>
		</div>
	</nav>


	<div class="container special">

		<h2 class="h2">Modification d'un compte</h2>
		<div>
			<form method="post"
				th:action="@{/sauvegarderCompte}" th:object="${compte}">
				<div class="form-group">
					<input
						type="hidden" th:field="*{numeroCompte}" class="form-control">
				</div>
				<div class="form-group">
					<label for="firstNameInput">Pr&eacute;nom</label> 
					<input
						type="text" th:field="*{prenom}" class="form-control" id="prenomInput"
						aria-describedby="prenomHelp" placeholder="Saisir le prénom"> <small
						id="prenomHelp" class="form-text text-muted">Merci d'&eacute;crire le pr&eacute;nom du titulaire du compte.</small>
				</div>
				<div class="form-group">
					<label for="nomInput">Nom</label> 
					<input
						type="text" th:field="*{nom}" class="form-control" id="nomInput"
						aria-describedby="nomHelp" placeholder="Saisir le nom"> <small
						id="nomHelp" class="form-text text-muted">Merci d'&eacute;crire le nom du titulaire du compte.</small>
				</div>
				<div class="form-group">
					<label for="mailInput">Email</label> 
					<input
						type="text" th:field="*{mail}" class="form-control" id="mailInput"
						aria-describedby="mailHelp" placeholder="Saisir l'adresse email"> <small
						id="mailHelp" class="form-text text-muted">Merci d'&eacute;crire l'adresse email du titulaire du compte.</small>
				</div>
				
				<button type="submit" class="btn btn-primary">Modifier</button>
				<a th:href="@{/}" class="btn btn-default">Annuler</a>
			</form>
		</div>

	</div>

	<script
		src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
	<script
		src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
		integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
		crossorigin="anonymous"></script>
</body>
</html>
